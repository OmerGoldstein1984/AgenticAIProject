      <text x="380" y="280" text-anchor="middle" font-weight="600" fill="#92400e">Odds Normalizer</text>
      <text x="380" y="300" text-anchor="middle" fill="#6b7280">Custom Node</text>
      <text x="380" y="315" text-anchor="middle" fill="#6b7280">3-format conversion</text>
      <text x="380" y="330" text-anchor="middle" fill="#6b7280">Arbitrage detection</text>

      <!-- Settlement Worker -->
      <rect x="510" y="260" width="200" height="100" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="610" y="280" text-anchor="middle" font-weight="600" fill="#92400e">Settlement Worker</text>
      <text x="610" y="300" text-anchor="middle" fill="#6b7280">Custom Node</text>
      <text x="610" y="315" text-anchor="middle" fill="#6b7280">Rule DSL Engine</text>
      <text x="610" y="330" text-anchor="middle" fill="#6b7280">Won/Lost/Void/Half</text>

      <!-- LLM Alert Generator -->
      <rect x="740" y="260" width="200" height="100" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="840" y="280" text-anchor="middle" font-weight="600" fill="#92400e">LLM Alert Gen</text>
      <text x="840" y="300" text-anchor="middle" fill="#6b7280">Custom Node</text>
      <text x="840" y="315" text-anchor="middle" fill="#6b7280">Structured Output</text>
      <text x="840" y="330" text-anchor="middle" fill="#6b7280">Confidence Scoring</text>

      <!-- Reconciliation Job -->
      <rect x="970" y="260" width="180" height="100" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="1060" y="280" text-anchor="middle" font-weight="600" fill="#92400e">Reconciliation</text>
      <text x="1060" y="300" text-anchor="middle" fill="#6b7280">Scheduled Job</text>
      <text x="1060" y="315" text-anchor="middle" fill="#6b7280">Daily Batch</text>
      <text x="1060" y="330" text-anchor="middle" fill="#6b7280">Checksum Compare</text>

      <!-- Internal n8n connections -->
      <line x1="250" y1="310" x2="280" y2="310" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
      <line x1="480" y1="310" x2="510" y2="310" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
      <line x1="710" y1="310" x2="740" y2="310" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
      <line x1="940" y1="310" x2="970" y2="310" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
    </g>

    <!-- Redis Streams (Queue) -->
