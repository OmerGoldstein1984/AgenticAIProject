    <!-- Output Systems Row -->
    <g font-size="11">
      <!-- Sportsbook CRM -->
      <rect x="50" y="440" width="200" height="80" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
      <text x="150" y="460" text-anchor="middle" font-weight="600" fill="#111827">Sportsbook CRM</text>
      <text x="150" y="478" text-anchor="middle" fill="#6b7280">Mock HubSpot/</text>
      <text x="150" y="494" text-anchor="middle" fill="#6b7280">Salesforce</text>
      <text x="150" y="510" text-anchor="middle" fill="#6b7280">OAuth + Webhooks</text>

      <!-- Risk Management -->
      <rect x="280" y="440" width="200" height="80" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
