  </svg>
  <figcaption>Figure 1: Sports Data Automation Platform Architecture — Data flows from mock providers (WebSocket, REST, Batch) through a Python ingestion service (normalize, validate, deduplicate) into n8n queue mode via Redis Streams. Custom TypeScript n8n nodes handle routing, odds normalization, settlement (rule DSL), and LLM alert generation with confidence scoring. Outputs integrate with mock SaaS systems. Observability plane collects metrics from all layers, powers Grafana dashboards for engineers and stakeholders, and routes alerts with runbook links via Alertmanager.</figcaption>
</figure>