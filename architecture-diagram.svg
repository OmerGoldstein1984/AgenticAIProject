      </marker>
      <marker id="arrow-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="currentColor"/>
      </marker>
      <linearGradient id="n8n-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
      </linearGradient>
      <linearGradient id="obs-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
      </linearGradient>
    </defs>

    <!-- Background layers -->
    <rect x="20" y="20" width="1160" height="180" rx="8" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="40" font-size="13" font-weight="600" fill="#6b7280">MOCK DATA PROVIDERS (Simulated LSports Feeds)</text>

    <rect x="20" y="220" width="1160" height="160" rx="8" fill="url(#n8n-gradient)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="40" y="240" font-size="13" font-weight="600" fill="#92400e">N8N ORCHESTRATION LAYER (Queue Mode + Redis Streams)</text>

    <rect x="20" y="400" width="1160" height="140" rx="8" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="420" font-size="13" font-weight="600" fill="#6b7280">OUTPUT SYSTEMS (Mock SaaS Integrations)</text>

    <rect x="20" y="560" width="1160" height="140" rx="8" fill="url(#obs-gradient)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="40" y="580" font-size="13" font-weight="600" fill="#0e7490">OBSERVABILITY & CONTROL PLANE</text>

    <!-- Mock Providers Row -->
    <g font-size="11">
      <!-- Odds Feed -->
      <rect x="50" y="60" width="180" height="110" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
      <text x="140" y="80" text-anchor="middle" font-weight="600" fill="#111827">Live Odds Feed</text>
      <text x="140" y="100" text-anchor="middle" fill="#6b7280">WebSocket</text>
      <text x="140" y="115" text-anchor="middle" fill="#6b7280">500ms–2s updates</text>
      <text x="140" y="135" text-anchor="middle" fill="#6b7280">Decimal/American/</text>
      <text x="140" y="150" text-anchor="middle" fill="#6b7280">Fractional formats</text>

      <!-- Event Feed -->
      <rect x="260" y="60" width="180" height="110" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
      <text x="350" y="80" text-anchor="middle" font-weight="600" fill="#111827">Event Feed</text>
      <text x="350" y="100" text-anchor="middle" fill="#6b7280">REST API</text>
      <text x="350" y="115" text-anchor="middle" fill="#6b7280">Goals, cards,</text>
      <text x="350" y="130" text-anchor="middle" fill="#6b7280">substitutions, injuries</text>

      <!-- Settlement Feed -->
      <rect x="470" y="60" width="180" height="110" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
      <text x="560" y="80" text-anchor="middle" font-weight="600" fill="#111827">Settlement Feed</text>
      <text x="560" y="100" text-anchor="middle" fill="#6b7280">Batch REST API</text>
      <text x="560" y="115" text-anchor="middle" fill="#6b7280">Post-match results</text>
      <text x="560" y="130" text-anchor="middle" fill="#6b7280">Official outcomes</text>

      <!-- Historical Replay -->
      <rect x="680" y="60" width="180" height="110" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
      <text x="770" y="80" text-anchor="middle" font-weight="600" fill="#111827">Historical Replay</text>
      <text x="770" y="100" text-anchor="middle" fill="#6b7280">CLI Tool</text>
      <text x="770" y="115" text-anchor="middle" fill="#6b7280">Backtesting &</text>
      <text x="770" y="130" text-anchor="middle" fill="#6b7280">shadow mode</text>

      <!-- Provider Schema Registry -->
      <rect x="890" y="60" width="180" height="110" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
      <text x="980" y="80" text-anchor="middle" font-weight="600" fill="#111827">Schema Registry</text>
      <text x="980" y="100" text-anchor="middle" fill="#6b7280">JSON Schema per</text>
      <text x="980" y="115" text-anchor="middle" fill="#6b7280">provider + version</text>
      <text x="980" y="130" text-anchor="middle" fill="#6b7280">Contract testing</text>

      <!-- Arrows from providers to ingestion -->
      <line x1="140" y1="170" x2="140" y2="220" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="350" y1="170" x2="350" y2="220" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="560" y1="170" x2="560" y2="220" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="770" y1="170" x2="770" y2="220" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="980" y1="170" x2="980" y2="220" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <!-- Ingestion Service (Python) - sits between providers and n8n -->
