    <g font-size="10" transform="translate(50, 540)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="18" y="10" fill="#374151">Custom n8n Node (TypeScript)</text>
      <rect x="0" y="20" width="12" height="12" rx="2" fill="#fff" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
