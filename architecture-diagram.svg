    <text x="1120" y="80" text-anchor="middle" font-weight="600" fill="#0369a1" font-size="11">Ingestion</text>
    <text x="1120" y="95" text-anchor="middle" fill="#0369a1" font-size="10">Service</text>
    <text x="1120" y="115" text-anchor="middle" fill="#0369a1" font-size="10">(FastAPI)</text>
    <text x="1120" y="135" text-anchor="middle" fill="#0369a1" font-size="10">Normalize</text>
