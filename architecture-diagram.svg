      <line x1="150" y1="260" x2="150" y2="600" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arrow-dashed)"/>
      <line x1="380" y1="260" x2="380" y2="600" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arrow-dashed)"/>
      <line x1="610" y1="260" x2="610" y2="600" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arrow-dashed)"/>
      <line x1="840" y1="260" x2="840" y2="600" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arrow-dashed)"/>
      <line x1="150" y1="520" x2="150" y2="600" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arrow-dashed)"/>
      <line x1="380" y1="520" x2="380" y2="600" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arrow-dashed)"/>
      <line x1="610" y1="520" x2="610" y2="600" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arrow-dashed)"/>
