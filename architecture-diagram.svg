<figure>
  <svg viewBox="0 0 1200 720" role="img" aria-label="Sports Data Automation Platform architecture showing data flow from mock providers through ingestion, n8n orchestration, processing engine, to output systems with observability plane" style="max-width: 100%; height: auto; font-family: system-ui, sans-serif;">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
