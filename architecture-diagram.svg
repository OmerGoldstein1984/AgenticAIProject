      <line x1="610" y1="360" x2="610" y2="440" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="840" y1="360" x2="840" y2="440" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="1060" y1="360" x2="1060" y2="440" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <!-- Observability Plane -->
    <g font-size="11">
