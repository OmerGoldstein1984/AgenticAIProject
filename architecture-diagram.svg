      <!-- Grafana -->
      <rect x="280" y="600" width="200" height="80" rx="6" fill="#fff" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="380" y="620" text-anchor="middle" font-weight="600" fill="#0e7490">Grafana</text>
      <text x="380" y="638" text-anchor="middle" fill="#6b7280">System Dashboard</text>
      <text x="380" y="654" text-anchor="middle" fill="#6b7280">Business KPI Dashboard</text>
