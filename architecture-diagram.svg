      <!-- Reporting Warehouse -->
      <rect x="510" y="440" width="200" height="80" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
      <text x="610" y="460" text-anchor="middle" font-weight="600" fill="#111827">Reporting</text>
      <text x="610" y="478" text-anchor="middle" fill="#6b7280">TimescaleDB /</text>
      <text x="610" y="494" text-anchor="middle" fill="#6b7280">ClickHouse</text>
      <text x="610" y="510" text-anchor="middle" fill="#6b7280">Analytics</text>

      <!-- Notification Service -->
      <rect x="740" y="440" width="200" height="80" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
