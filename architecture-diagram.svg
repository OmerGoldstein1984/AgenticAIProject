    <text x="1120" y="165" text-anchor="middle" fill="#0369a1" font-size="10">Deduplicate</text>

    <line x1="1120" y1="170" x2="1120" y2="220" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)"/>

