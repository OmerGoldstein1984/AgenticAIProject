    <text x="1120" y="280" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="600">CI/CD</text>
    <text x="1120" y="310" text-anchor="middle" font-size="9" fill="#6b7280">GitHub Actions</text>
    <text x="1120" y="340" text-anchor="middle" font-size="9" fill="#6b7280">Contract Tests</text>
    <text x="1120" y="370" text-anchor="middle" font-size="9" fill="#6b7280">Integration Tests</text>
    <text x="1120" y="400" text-anchor="middle" font-size="9" fill="#6b7280">E2E Tests</text>
