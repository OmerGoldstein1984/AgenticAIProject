version: '3.8'

services:
  # Core infrastructure
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: sports_automation
      POSTGRES_USER: sports_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_user -d sports_automation"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # n8n Orchestration
  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: development
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: sports_automation
      DB_POSTGRESDB_USER: sports_user
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-changeme}
      N8N_CUSTOM_EXTENSIONS: /home/node/.n8n/custom
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_DB: 1
    volumes:
      - n8n_data:/home/node/.n8n
      - ./packages/n8n-nodes/dist:/home/node/.n8n/custom
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ingestion Service (Python FastAPI)
  ingestion-service:
    build:
      context: ./packages/ingestion-service
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://sports_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/sports_automation
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      LOG_LEVEL: DEBUG
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/ingestion-service:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # Processing Engine (Python)
  processing-engine:
    build:
      context: ./packages/processing-engine
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://sports_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/sports_automation
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LOG_LEVEL: DEBUG
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/processing-engine:/app/src

  # Mock Providers
  mock-odds-feed:
    build:
      context: ./packages/mock-providers
      dockerfile: Dockerfile.odds
    environment:
      REDIS_URL: redis://redis:6379/0
      FEED_INTERVAL_MS: 500
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  mock-event-feed:
    build:
      context: ./packages/mock-providers
      dockerfile: Dockerfile.events
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - ingestion-service
      - processing-engine
      - n8n

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./monitoring/prometheus/alerts/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: sports-automation-network