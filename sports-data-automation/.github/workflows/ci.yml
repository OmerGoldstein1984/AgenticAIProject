# .github/workflows/ci.yml
# ========================
# FILE HEADER
# -----------
# Business problem this file solves:
#   Every push to main/develop and every pull request must be validated (lint, test, type-check,
#   docker build) before it can break production. This GitHub Actions workflow automates that so
#   bad code is caught in CI, not by a trader during a live match.
#
# Where it sits in the flow:
#   CI/CD layer — the quality gate that runs on every change, before deploy-staging /
#   deploy-production.
#
# What calls it / what it calls:
#   Called by: GitHub Actions on push (main, develop) and pull_request (main).
#   Calls: actions/checkout, setup-node, setup-python, npm ci, npm test/lint/build, pip,
#   pytest, docker compose.
#
# What breaks if removed:
#   No automated quality gate; changes merge untested.
#
# Language conventions:
#   GitHub Actions YAML. Jobs: lint-and-test, type-check, docker-build, deploy-staging,
#   deploy-production (gated by branch/environment).
#
# # INTERVIEW: CI runs lint + test + type-check + docker-build before any deploy — know this so
#    you can speak to the quality gate. deploy-staging/deploy-production are placeholders
#    (echo only) — real deploy commands not implemented.
# # GAP: the workflow runs pytest against packages/*/tests/ directories and processing-engine
#    that don't exist in this repo, so the Python test steps would fail/fall back. See
#    07_issues_found.md.
#

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/n8n-nodes/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            packages/ingestion-service/pyproject.toml
            packages/processing-engine/pyproject.toml
            packages/mock-providers/pyproject.toml

      - name: Install n8n-nodes deps
        run: cd packages/n8n-nodes && npm ci

      - name: Lint n8n-nodes
        run: cd packages/n8n-nodes && npm run lint

      - name: Test n8n-nodes
        run: cd packages/n8n-nodes && npm test

      - name: Build n8n-nodes
        run: cd packages/n8n-nodes && npm run build

      - name: Install Python deps (ingestion)
        run: |
          cd packages/ingestion-service
          pip install -e ".[dev]"

      - name: Test ingestion-service
        run: |
          cd packages/ingestion-service
          pytest tests/ -v --tb=short --cov=src --cov-report=xml

      - name: Install Python deps (processing)
        run: |
          cd packages/processing-engine
          pip install -e ".[dev]"

      - name: Test processing-engine
        run: |
          cd packages/processing-engine
          pytest tests/ -v --tb=short --cov=src --cov-report=xml

      - name: Install Python deps (mock-providers)
        run: |
          cd packages/mock-providers
          pip install -e ".[dev]"

      - name: Test mock-providers
        run: |
          cd packages/mock-providers
          pytest tests/ -v --tb=short

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Type check canonical-types
        run: |
          cd packages/canonical-types
          npm ci
          npm run build
      - name: Type check n8n-nodes
        run: |
          cd packages/n8n-nodes
          npm ci
          npx tsc --noEmit

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-test, type-check]
    steps:
      - uses: actions/checkout@v4
      - name: Build all Docker images
        run: |
          docker compose build --parallel
      - name: Test Docker images start
        run: |
          docker compose up -d
          sleep 30
          docker compose ps
          docker compose down

  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Add your staging deployment commands here

  deploy-production:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your production deployment commands here